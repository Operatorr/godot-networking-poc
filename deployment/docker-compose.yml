services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: omega-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-omega}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-omega_password}
      POSTGRES_DB: ${DB_NAME:-omega_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-omega}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omega-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: omega-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omega-network
    restart: unless-stopped

  # Go API Server
  api:
    build:
      context: ../api
      dockerfile: ../deployment/api.Dockerfile
    container_name: omega-api
    environment:
      PORT: ${API_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-omega}
      DB_PASSWORD: ${DB_PASSWORD:-omega_password}
      DB_NAME: ${DB_NAME:-omega_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${API_PORT:-8080}/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - omega-network
    restart: unless-stopped

  # Rust Game Server (ENet/UDP) — one container = one Instance (migration-spec D13)
  game-server:
    build:
      context: ..
      dockerfile: deployment/server.Dockerfile
    container_name: omega-game-server
    environment:
      # Dev default; production sets OMEGA_ALLOW_UNSIGNED_TICKETS=false + OMEGA_TICKET_PUBKEY.
      OMEGA_ALLOW_UNSIGNED_TICKETS: ${OMEGA_ALLOW_UNSIGNED_TICKETS:-true}
      OMEGA_TICKET_PUBKEY: ${OMEGA_TICKET_PUBKEY:-}
    ports:
      - "${GAME_SERVER_PORT:-8081}:8081/udp"
      - "${GAME_METRICS_PORT:-9100}:9100"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - omega-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  omega-network:
    driver: bridge
