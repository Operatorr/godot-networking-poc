[workspace]
resolver = "2"
members = ["protocol", "sim_core", "server", "client_ext", "load_test"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
protocol = { path = "protocol" }
sim_core = { path = "sim_core" }
# Exact pin: pre-1.0 and the GitHub master API is already incompatible with 0.4 (see
# docs/rust-port/extraction/rust-stack-notes.md). Wire-compatible with Godot 4.6's bundled
# ENet 1.3.18 only as long as checksum/compressor stay disabled on both sides.
rusty_enet = "=0.4.0"
godot = { version = "0.5.3", features = ["api-4-6"] }
ed25519-dalek = "2.2"
ctrlc = "3.5"
ureq = { version = "3.3", features = ["json"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

[profile.release]
lto = "thin"
