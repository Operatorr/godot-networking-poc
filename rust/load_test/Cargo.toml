[package]
name = "omega-load-test"
version.workspace = true
edition.workspace = true
description = "ENet bot-swarm load-testing harness — links the protocol crate directly, so codec drift with the server is impossible by construction"

[[bin]]
name = "omega-load-test"
path = "src/main.rs"

[features]
# Adds `--fault` for the measurement fault battery. Never part of a frozen benchmark build.
fault-injection = []

[dependencies]
protocol.workspace = true
sim_core.workspace = true
rusty_enet.workspace = true
ctrlc.workspace = true
ureq.workspace = true
base64.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
